<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Reeff.PDF">
  <!-- Reeff.PDF mark — the single source of truth for every icon, OG image and PWA asset.
       Run `npm run brand` after editing; it re-derives icon.svg / icon.png (32) /
       icon1.png (48) / icon2.png (96) / apple-icon.png (180) / opengraph-image.png /
       brand/icon-192|512|512-maskable. Pass the accent flag (for example accent=#7C3AED,
       name=image) to npm run brand for the next vertical (image./audio./receipt.reeff.app).

       Geometry: the R is the real outline of Liberation Sans Bold (Arial-metric-compatible,
       SIL OFL 1.1) with cap height 16.5 and baseline y=24.2; the square dot sits on the
       baseline, 0.8 clear of the R's ink (measured: right foot spans x 15.8–19.6 at the
       baseline). The pair is centred as one group: originX = (32 - (RInk 15.22 + gap + dot)) / 2.
       To resize the dot, change width/height below AND recompute x = originX + 15.22 + 0.8,
       y = 24.2 - size, then re-run `npm run brand`. -->
  <rect width="32" height="32" rx="7" fill="#0F172A"/>
  <path d="M15.72,24.2L11.89,17.93L7.84,17.93L7.84,24.2L4.39,24.2L4.39,7.7L12.63,7.7Q15.58,7.7 17.19,8.97Q18.79,10.24 18.79,12.62Q18.79,14.35 17.81,15.61Q16.82,16.87 15.15,17.27L19.61,24.2ZM15.31,12.76Q15.31,10.38 12.27,10.38L7.84,10.38L7.84,15.25L12.36,15.25Q13.82,15.25 14.56,14.6Q15.31,13.94 15.31,12.76Z" fill="#FFFFFF"/>
  <rect id="dot" x="20.41" y="17.00" width="7.2" height="7.2" fill="#DC2626"/>
</svg>
